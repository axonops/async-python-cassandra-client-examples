version: '3.8'

services:
  cassandra:
    image: cassandra:5.0
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra/cassandra.yaml:/etc/cassandra/cassandra.yaml:ro
      - ./cassandra/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cassandra-network

  async-app:
    build: ./apps/async-app
    expose:
      - "8000"
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=perftest
      - CASSANDRA_DATACENTER=datacenter1
      - APP_PORT=8000
      - METRICS_ENABLED=true
      - LOG_LEVEL=INFO
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cassandra-network
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"

  sync-app:
    build: ./apps/sync-app
    expose:
      - "8000"
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=perftest
      - CASSANDRA_DATACENTER=datacenter1
      - APP_PORT=8000
      - METRICS_ENABLED=true
      - LOG_LEVEL=INFO
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cassandra-network
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"

  prometheus:
    image: prom/prometheus:latest
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - cassandra-network

  grafana:
    image: grafana/grafana:latest
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cassandra-network

  loki:
    image: grafana/loki:latest
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cassandra-network

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cassandra-network

  web-ui:
    build: ./apps/web-ui
    ports:
      - "3001:80"
    environment:
      - ASYNC_API_URL=http://async-app:8000
      - SYNC_API_URL=http://sync-app:8000
      - GRAFANA_URL=http://grafana:3000
    depends_on:
      - async-app
      - sync-app
    networks:
      - cassandra-network

volumes:
  cassandra_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  cassandra-network:
    driver: bridge